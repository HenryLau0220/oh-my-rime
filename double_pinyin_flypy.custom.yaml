# 1. 下载万象模型wanxiang-lts-zh-hans
# 2. 创建文件dicts/custom_phrase_double.txt
patch:
  # 语言模型
  "grammar/language": wanxiang-lts-zh-hans
  "grammar/collocation_max_length": 5
  "grammar/collocation_min_length": 2

  # translator 内加载
  "translator/contextual_suggestions": true
  "translator/max_homophones": 7
  "translator/max_homographs": 7

  custom_phrase:
    dictionary: ""
    user_dict: dicts/custom_phrase_double
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 10 # 大于其他的翻译器
  # 关闭简易计算器
  "recognizer/patterns/expression": ""
  "engine/filters":
    - lua_filter@*corrector_filter              # 错音错字提示
    - lua_filter@*super_preedit                 # 输入码显示全拼并带上音调
    - lua_filter@*autocap_filter                # 英文自动大写
    - lua_filter@*pin_cand_filter               # 置顶候选项（顺序要求：置顶候选项 > Emoji > 简繁切换）
    # - lua_filter@*is_in_user_dict               # 用户词典的词加上一个*
    - simplifier@emoji_suggestion
    - simplifier@transcription_cc
    - simplifier@chaifen_cc                     # 拆字辅助滤镜
    - lua_filter@*auxCode_filter@moqi_aux_code  # 小鹤双拼辅码(音形)
    - lua_filter@*reduce_english_filter         # 降低部分英语单词在候选项的位置
    - uniquifier                                # 去重
  "engine/translators":
    - punct_translator                                   # ※ 轉換標點符號
    - script_translator
    - lua_translator@*shijian                            # 时间、日期、星期、月份、问候、节气、节日，N模式
    - lua_translator@*number_translator                  # 金额大小写
    - lua_translator@*chineseLunarCalendar_translator    # 农历
    - lua_translator@*mint_calculator_translator         # 计算器（lua 动态表达式）
    - table_translator@custom_phrase                     # 自定义短语 custom_phrase_double.txt
    - table_translator@melt_eng                          # 英文输入（作为子翻译器，优先级需要比原生的低）
    - table_translator@cn_en                             # 中英混合词汇
    - reverse_lookup_translator@radical_reverse_lookup
    - reverse_lookup_translator@wubi98_mint
    - reverse_lookup_translator@stroke
    - lua_translator@*force_gc                           # 暴力GC，尝试解决小狼毫长期使用的卡顿
  # 拆字辅助滤镜
  chaifen_cc:
    opencc_config: moqi_chaifen.json
    option_name: chaifen
    show_in_comment: true  # 是否仅将转换结果显示在备注中
    comment_format:
      - "xform/&nbsp;/ /"
      - "xform/\t/ /"
    tags:                  # 设置其作用范围
      - abc
      - storkfly
      - reverse_lookup
    tips: char             #  单字加滤镜: char; 全部: all
  pin_cand_filter:
    # 格式：编码<Tab>字词1<Space>字词2……
    # 单编码
    - q	去 千
    - w	我 万 往
    - e	呃
    - r	让 人
    - t	他 她 它 祂
    - y	与 于
    # - u 在 custom_phrase 置顶了 有 🈶 又 由
    # - i 在 custom_phrase 置顶了 一 以 已 亦
    - o	哦
    - p	片 篇
    - a	啊
    - s	是 时 使 式
    - d	的 地 得
    - f	发 放 分
    - g	个 各
    - h	和 或
    - j	及 将 即 既 继
    - k	可
    - l	了 啦 喽 嘞
    - z	在 再 自
    - x	想 像 向
    - c	才 从
    # - v
    - b	吧 把 呗 百
    - n	那 哪 拿 呐
    - m	吗 嘛 呣 呒
    # 常用单字
