    - hui	会
    - hai	还
    - hao	好
    - ji	及 即 既
    - jin	仅 近 进 今 金
    - jiu	就
    - jiang	将
    - ke	可
    - kan	看
    - kai	开
    - le	了
    - la	啦 拉
    - lai	来
    - li	里
