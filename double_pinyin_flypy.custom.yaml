    - na	那 哪 拿 呐
    - ni	你
    - ma	吗 嘛 妈
    - mei	没
    - mai	买 卖
    - reng	仍 扔
    # ta、na
    - ta men	他们 她们 它们
    - tm	他们 她们 它们
    - ta de	他的 她的 它的
    - td	他的 她的 它的
    - ta men de	他们的 她们的 它们的
